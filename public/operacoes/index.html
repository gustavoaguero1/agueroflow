/* Layout: barra superior fixa com navegação; conteúdo em largura de ferramenta (máx. 1280px); editor em painel lateral. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#18232B; --muted:#5D6B75; --line:#D5DCE1;
  --accent:#0B5C73; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --good:#1E7A46; --good-bg:#DDF2E5; --warn:#8A5A00; --warn-bg:#FBEFCF; --bad:#A3262A; --bad-bg:#F8DEDF; --idle:#4A555D; --idle-bg:#E3E7EA;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181C; --surface:#1A2228; --ink:#E4EAEE; --muted:#93A1AA; --line:#2C3740;
  --accent:#4FB3CC; --accent-ink:#06222B; --accent-soft:#183843;
  --good:#6FD39A; --good-bg:#16352A; --warn:#F0C05A; --warn-bg:#3A2E12; --bad:#F08A8D; --bad-bg:#3D1B1D; --idle:#B7C2C9; --idle-bg:#2A333A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12181C; --surface:#1A2228; --ink:#E4EAEE; --muted:#93A1AA; --line:#2C3740;
  --accent:#4FB3CC; --accent-ink:#06222B; --accent-soft:#183843;
  --good:#6FD39A; --good-bg:#16352A; --warn:#F0C05A; --warn-bg:#3A2E12; --bad:#F08A8D; --bad-bg:#3D1B1D; --idle:#B7C2C9; --idle-bg:#2A333A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand i{display:inline-block;width:14px;height:14px;background:linear-gradient(135deg,#B9C3C9,#6E7B83);border-radius:2px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.main a{padding:7px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
nav.main a.on{background:var(--accent-soft);color:var(--accent)}
nav.main a:hover{color:var(--ink)}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.role{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--idle-bg);color:var(--idle)}
.role.g{background:var(--accent);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dang{color:var(--bad)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f > span{color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{display:grid;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:18px}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--display);font-size:20px}
.stat{display:grid;gap:2px} .stat b{font-family:var(--display);font-size:24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg);position:sticky;top:0;white-space:nowrap}
td.r,th.r{text-align:right} tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-CONTRATAR{background:var(--good-bg);color:var(--good)} .p-AVALIAR{background:var(--warn-bg);color:var(--warn)}
.p-NAO{background:var(--bad-bg);color:var(--bad)} .p-PENDENTE{background:var(--idle-bg);color:var(--idle)}
.bar{height:6px;background:var(--idle-bg);border-radius:3px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%}
.alerts{margin:0;padding-left:18px;color:var(--bad);font-size:12px}
.drawer{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:50;display:none}
.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(1100px,100%);background:var(--bg);overflow:auto;display:grid;grid-template-rows:auto 1fr}
.panel .ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2;flex-wrap:wrap}
.pb{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px;align-items:start}
@media (max-width:860px){.pb{grid-template-columns:1fr}}
.side{display:grid;gap:12px;align-content:start;min-width:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.kv .t{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.big{font-family:var(--display);font-size:30px;font-weight:700}
.sc{display:grid;grid-template-columns:1fr 40px 80px;gap:6px;align-items:center;font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:90;display:none;max-width:90vw}
.notice{border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:10px 12px;border-radius:6px}
.lock{border-left:4px solid var(--idle);background:var(--idle-bg);padding:10px 12px;border-radius:6px}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cmp td.best{background:var(--good-bg);font-weight:600}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;background:var(--surface);display:grid;gap:12px}
legend{font-family:var(--display);font-weight:600;padding:0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="agueroflow-theme">
/* Visual do AgueroFlow: mesma fonte, cores, cantos e modo escuro do app. Vem depois do estilo original e só troca aparência. */

  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Plus Jakarta Sans","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Plus Jakarta Sans","Helvetica Neue",sans-serif;
  --r-card:12px; --r-ctl:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C10; --surface:#161618; --ink:#F5F5F7; --muted:#98989D; --line:#2C2C2E;
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2742;

:root[data-theme="dark"]{
  --bg:#0B0C10; --surface:#161618; --ink:#F5F5F7; --muted:#98989D; --line:#2C2C2E;
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0B2742;
  --good:#30D158; --good-bg:#0F2E19; --warn:#FF9F0A; --warn-bg:#3A2A0D; --bad:#FF453A; --bad-bg:#3B1416; --idle:#AEAEB2; --idle-bg:#232326;}
html,body{font:14px/1.47 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px}
.card,.tile,.tw,fieldset{border-radius:var(--r-card)}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn,input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border-radius:var(--r-ctl)}
.btn{font-weight:500;transition:border-color .15s,background-color .15s}
.btn.pri{box-shadow:0 1px 3px rgba(0,113,227,.28)}
.btn.pri:hover{filter:brightness(1.06)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs button.on{font-weight:600}
th{letter-spacing:0}
/* Dentro do AgueroFlow: o menu lateral do app faz a navegação. */
html.embedded header.top{display:none}
html.embedded main{max-width:none;padding:4px 4px 48px}
html.embedded #main > .tabs:first-child:has(> a){display:none}
input[type=file]{font-size:13px;color:var(--muted)}
input[type=file]::file-selector-button{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:6px 12px;margin-right:10px;cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
/* Controle de gases */
.gas-filtros{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.gas-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.gas-kpis .stat{display:grid;gap:2px}
.gas-kpis .stat b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.gas-2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:900px){.gas-2{grid-template-columns:1fr}}
.gas-2 h3{margin-bottom:8px}
.gas-2 .tw{max-height:360px;overflow:auto}
.gas-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:190px;align-items:end;padding-top:18px}
.gas-bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;align-items:end;text-align:center;min-width:0}
.gas-bar i{display:block;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;align-self:end}
.gas-bar span{font-size:11px;color:var(--muted);padding-top:4px}
.gas-bar-v{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gas-pends{display:grid;gap:10px;margin-top:10px}
.gas-pend{display:grid;gap:8px}
.gas-pend.feita{opacity:.72}
@media (max-width:640px){.gas-bar-v{display:none}}
</style>

  const val=ns.filter(x=>typeof x==='number');if(val.length)out.sc.tec=val.reduce((a,b)=>a+b,0)/val.length;
  const fn=usaFotos(c.func)?fotoNota(c):null;if(fn)out.sc.fot=fn.n;out.block=!!(fn&&fn.block);
  const ex=(c.exps||[]).filter(e=>e.empresa||e.adm);

  if(!chk.length&&ex.length)out.sc.tec=band(out.mesesNossos,[0,0.01,6,12],[3,5,7,10]);

  let sw=0,sv=0,tw=0;for(const k in p.pesos){tw+=+p.pesos[k]||0;if(out.sc[k]!=null){sw+=+p.pesos[k]||0;sv+=out.sc[k]*(+p.pesos[k]||0)}}
  out.nota=sw?sv/sw:null;out.cob=tw?sw/tw:0;
  if(out.block)out.alerts.push('Fotos mostram '+fn.fn.toLowerCase()+', não '+String(c.func).toLowerCase()+'.');
  if(!c.obraId&&!c.obra)out.alerts.push('Escolha a obra.');else if(!obraCidade(c))out.alerts.push('Obra sem cidade cadastrada (Base de dados → Obras).');

  if(out.caro)out.alerts.push('Custa '+Math.round((out.ratio-1)*100)+'% a mais por mês que a média da equipe de '+String(c.func).toLowerCase()+': não compensa.');

/* métrica: quantas etapas cada pessoa fez e quanto tempo levou desde que a etapa ficou liberada */
function metricasTarefas(){const m={};
  for(const t of S.tar){const it=t.itens||[];it.forEach((i,k)=>{if(!i.feito||!i.por)return;const ini=Date.parse(k?it[k-1].em:t.criado),fim=Date.parse(i.em);
    const e=m[i.por]||(m[i.por]={n:0,h:0,hn:0,ult:''});e.n++;if(isFinite(ini)&&isFinite(fim)&&fim>=ini){e.h+=(fim-ini)/36e5;e.hn++}if((i.em||'')>e.ult)e.ult=i.em})}
  const ids=Object.keys(m);if(!ids.length)return '<div class="card small muted">Métrica por pessoa aparece aqui quando as primeiras etapas forem marcadas.</div>';
  if(user&&ids.some(i=>!(i in S.names)))resolveNomes(ids);
  const pend=S.tar.reduce((t,x)=>t+tarefasPend(x),0);
  const fmtH=h=>h<1?Math.round(h*60)+' min':h<48?n1(h)+' h':n1(h/24)+' dias';
  return `<div class="card" style="display:grid;gap:8px"><div class="row"><h3>Quem fez (métrica)</h3><span class="sp"></span><span class="small muted">${pend} etapa(s) pendentes agora</span></div>

   ${ids.sort((a,b)=>m[b].n-m[a].n).map(i=>`<tr><td>${esc(S.names[i]||'…')}${S.membros[i]?' <span class="small muted">'+esc(S.membros[i].papel)+'</span>':''}</td><td class="r num">${m[i].n}</td><td class="r num">${m[i].hn?fmtH(m[i].h/m[i].hn):'—'}</td><td class="small">${dbr((m[i].ult||'').slice(0,10))}</td></tr>`).join('')}</table></div>
   <div class="small muted">Tempo médio: da hora em que a etapa ficou liberada (contratação aprovada ou etapa anterior feita) até a pessoa marcar.</div></div>`}

/* prazo para decidir: 7 dias desde que o candidato entrou; sem decisão, ele vai para Indicações com tudo o que foi lançado */
const PRAZO_DIAS=7;
function idadeDias(c){const t=Date.parse(c.criado||c.atualizado||c.dt||'');return isFinite(t)?(Date.now()-t)/864e5:0}
function prazoTxt(c){if(c.decisaoFinal)return 'Decidido: '+c.decisaoFinal+(c.decididoEm?' em '+dbr(c.decididoEm.slice(0,10)):'')+'.';
  const r=Math.ceil(PRAZO_DIAS-idadeDias(c));return r>0?'Sem decisão: vai para Indicações em '+r+' dia'+(r>1?'s':'')+'.':'Prazo vencido: vai para Indicações.'}
let moverRodando=false;
async function moverVencidos(){if(moverRodando||!db||S.me.canWrite===false||S.loaded.cand!==true)return;
  const venc=S.cand.filter(c=>!c.decisaoFinal&&idadeDias(c)>=PRAZO_DIAS);if(!venc.length)return;moverRodando=true;
  try{for(const c of venc){const a=avaliar(c);const o=obraDe(c);
    const extras=[c.motivoSaida?'Por que saiu da Aguero: '+c.motivoSaida:'',c.obs||'',a.nota!=null?'Nota na contratação: '+n1(a.nota)+' ('+a.dec+')':'',o?'Obra avaliada: '+o.nome:''].filter(Boolean).join(' | ');
    const ind={data:(c.dt||new Date().toISOString().slice(0,10)),nome:c.nome||'',funcao:c.func||'',telefone:c.tel||'',cidade:c.mora||'',
      indicadoPor:(c.inds||[]).filter(i=>i.quem).map(i=>(/^Outra pessoa/.test(i.quem)?(i.nome||'outra pessoa'):i.quem)+(i.junto?' (trabalhou junto)':'')).join(', '),
      status:'Nova',origem:c.origem||'Candidato sem decisão',regime:c.reg||'',salario:num(c.sal),folga:c.int||'',obs:extras,cand:clean({...c,id:undefined}),movidoEm:new Date().toISOString()};
    const ok=await save(()=>db.collection('indicacoes').add(clean(ind)));if(!ok)break;await save(()=>db.doc('candidatos/'+c.id).delete())}
  toast(venc.length+' candidato(s) sem decisão há '+PRAZO_DIAS+' dias foram para Indicações.')}finally{moverRodando=false}}
/* ---------- aprovação: candidato vira colaborador e nascem as tarefas dos auxiliares ---------- */
const TAREFAS_PADRAO=['Enviar o e-mail de contratação do RH, formalizando a contratação','Fazer a documentação do colaborador','Criar cadastro, criar alocação no SG3 e subir documentos','Subir documentação em outra plataforma, se precisar (Sertras, Chronos ou Piracanjuba)'];
const PLATAFORMAS=['Sertras','Chronos','Piracanjuba'];
async function aprovarCandidato(c){
  if(!db)return false;const a=avaliar(c);const o=obraDe(c);const now=new Date().toISOString();
  const id='c-'+keyCity(c.nome||'novo').replace(/\//g,'')+'-'+Date.now().toString(36);
  const colab=clean({nome:c.nome||'',funcao:c.func||'',cidade:c.mora||'',telefone:c.tel||'',folga:String(num(c.int)??folgaPadrao(c.func)),regime:c.reg||'CLT',
    transporte:a.lg.r.v===0?'Sem viagem':(a.lg.r.modal==='Avião'||(a.lg.r.it&&a.lg.r.it.esc.modo==='Avião'))?'Avião':'Ônibus',
    passagemCiclo:a.lg.r.v!=null?Math.round(a.lg.r.v*2):null,obraAtual:c.obraId||'',status:'Ativo',admissao:now.slice(0,10),cicloInicio:now.slice(0,10),
    contratacao:{aprovadoEm:now,nota:a.nota,recomendacao:a.dec,origem:c.origem||'',checagem:c.chk||{},obs:c.obs||''}});
  if(!await save(()=>db.doc('colaboradores/'+id).set(colab)))return false;
  let salOk=true;const sv=num(c.sal);
  if(sv!=null){if(S.me.isG)salOk=await save(()=>db.doc('salarios/'+id).set(c.reg==='PJ'?{clt:0,pj:sv}:{clt:sv,pj:0}));else salOk=false}
  await save(()=>db.doc('tarefas/'+id).set(clean({colabId:id,nome:c.nome||'',funcao:c.func||'',obra:o?o.nome:'',criado:now,
    itens:TAREFAS_PADRAO.map((t,i)=>({t,feito:false,por:null,em:null,...(i===3?{plataformas:[],naoPrecisa:false}:{})}))})));
  await save(()=>db.doc('candidatos/'+c.id).delete());
  toast(salOk?'Contratado: '+c.nome+' está em Colaboradores e as tarefas dos auxiliares foram criadas.':'Contratado. Um gerente precisa lançar o salário de '+c.nome+' em Custos e salários.');
  return true}

function obrasOrdenadas(){return S.obras.filter(o=>o.status!=='Encerrada').slice().sort((a,b)=>(a.coordenador||'').localeCompare(b.coordenador||'')||(a.nome||'').localeCompare(b.nome||''))}
function cidadesDaUF(uf){if(GEO&&GEO.byUF[uf])return GEO.byUF[uf];return cidadesTodas().filter(c=>ufOf(c)===uf).map(c=>c.split('/')[0])}

const PRIOS={barata:['Mais barata',0.8,0.2],equilibrada:['Equilibrada',0.5,0.5],tecnica:['Melhor técnica (cliente novo / obra crítica)',0.2,0.8]};
function montarEquipe(pool,C,prio,trav=[],outras=[]){
  const [,wc,wt]=PRIOS[prio];const val=x=>wc*x.costSc+wt*x.tec;
  const used=new Set();const membros=[];const faltas=[];const q={...C.q};
  trav.forEach(x=>{used.add(x.c.id);membros.push({...x,vaga:'🔒 Já na obra',trav:true})});
  /* primeiro quem está sem obra; se não tiver, puxa de outra obra (aparece a etiqueta da obra) */
  const melhorDe=(lista,funcao,excl)=>lista.filter(x=>serve(x.c.funcao,funcao)&&!used.has(x.c.id)&&!excl.has(x.c.id)).sort((a,b)=>val(b)-val(a))[0];
  const melhor=(funcao,excl)=>melhorDe(pool,funcao,excl)||(C.soLivres?null:melhorDe(outras,funcao,excl));
  for(let d=1;d<=C.duplas;d++){let best=null;
    for(const k of Object.keys(COMBOS)){if(!C.combos[k])continue;const ex=new Set();const ps=[];
      for(const f of COMBOS[k]){const p=melhor(f,ex);if(!p)break;ps.push(p);ex.add(p.c.id)}
      if(ps.length===COMBOS[k].length){const v=ps.reduce((t,p)=>t+val(p),0)/ps.length;if(!best||v>best.v)best={v,ps,k}}}
    if(!best){faltas.push('Dupla '+d+' (nenhuma combinação marcada tem gente disponível)');continue}
    best.ps.forEach(p=>{used.add(p.c.id);membros.push({...p,vaga:'Dupla '+d})})}
  for(const [f,n] of Object.entries(q)){for(let i=0;i<(+n||0);i++){const p=melhor(f,new Set());if(!p){faltas.push(f+(n>1?' ('+(i+1)+'º)':''));continue}used.add(p.c.id);membros.push({...p,vaga:f})}}

}

const hojeISO=()=>new Date().toISOString().slice(0,10);

   semFolgaLocal = mora na cidade da obra, não tem folga */
function linhaEscala(c){const hoje=hojeISO();const iv0=folgaDe(c)??folgaPadrao(c.funcao);const fd=+P().folgaDias||5;const local=!!c.semFolgaLocal;const iv=local?0:iv0;

  if(!ini&&saida&&iv>0){ini=addDias(saida,-iv);iniEst=true}

/* ---------- Diário de obras, hora viagem e fechamento das 220 h ---------- */
const SITS=['Trabalhou','Folga','Viagem','Atestado','Falta','Parado (chuva/obra parada)','Sem obra'];
const SIT_OBRA=['Trabalhou','Viagem','Parado (chuva/obra parada)','Atestado','Falta','Folga'];
const DCFG=()=>({editores:[],prazo:'12:00',jSemana:8.8,jSabado:0,...(S.dcfg||{})});
const podeDiario=()=>S.me.canWrite!==false&&(S.me.isG||(DCFG().editores||[]).includes(S.me.id));
const diaSemana=iso=>new Date(iso+'T12:00:00').getDay();
const diaUtilDiario=iso=>diaSemana(iso)!==0;
const jornadaDia=iso=>{const d=diaSemana(iso);const c=DCFG();return d===0?0:d===6?+c.jSabado||0:+c.jSemana||0};
const diarioDe=iso=>S.diario.find(d=>d.id===iso);
function ativosDiario(){return S.colab.filter(c=>c.status!=='Desligado')}
/* folga pela escala naquele dia */
function folgaNoDia(c,iso){const e=linhaEscala(c);if(iso===hojeISO())return e.volta!=null?e.retEf:null;const proj=folgasProj(c,e,addDias(iso,1));const f=proj.find(([a,b])=>iso>=a&&iso<b);return f?f[1]:null}
function linhaDiario(d,c,iso){const l=d&&d.linhas&&d.linhas[c.id];if(l)return{...l,lancado:true};const r=folgaNoDia(c,iso);
  if(r)return{obra:c.obraAtual||'',sit:'Folga',hn:0,h50:0,h100:0,obs:'folga (escala) – volta '+dbr(r),lancado:true,auto:true};return{obra:c.obraAtual||'',sit:'',hn:'',h50:'',h100:'',lancado:false}}
function faltandoDiario(iso){const d=diarioDe(iso);return ativosDiario().filter(c=>!linhaDiario(d,c,iso).lancado||!linhaDiario(d,c,iso).sit)}
async function salvarLinhas(iso,upd){const d=diarioDe(iso);const lin={...((d&&d.linhas)||{})};Object.entries(upd).forEach(([id,v])=>{lin[id]={...(lin[id]||{}),...v}});
  const base=d?{...d}:{data:iso,status:'Rascunho'};delete base.id;base.linhas=lin;base.atualizado=new Date().toISOString();base.atualizadoPor=S.me.name||'';
  return save(()=>db.doc('diario/'+iso).set(clean(base)))}
/* acha colaborador e obra por texto */
function acharColab(nome){const n=semAc(nome).trim();if(!n)return null;const at=ativosDiario();return at.find(c=>semAc(c.nome)===n)||at.find(c=>semAc(c.nome).startsWith(n))||at.find(c=>n.startsWith(semAc(c.nome)))||(()=>{const r=at.filter(c=>semAc(c.nome).includes(n)||n.includes(semAc(c.nome).split(' ')[0])&&semAc(c.nome).split(' ').slice(1).some(p=>p.length>2&&n.includes(p)));return r.length===1?r[0]:null})()}
function acharObra(t){const n=semAc(t||'');if(!n)return null;const m=n.match(/(\d{4})\s*[\/-]\s*(\d{2})/);if(m){const o=S.obras.find(o=>(o.os||'').replace('/','-')===m[1]+'-'+m[2]||o.id===m[1]+'-'+m[2]);if(o)return o}
  return S.obras.find(o=>semAc(o.nome)===n)||S.obras.find(o=>n.includes(semAc(o.nome)))||S.obras.find(o=>semAc(o.nome).includes(n))||S.obras.find(o=>n.split(/\s+/).filter(p=>p.length>3).some(p=>semAc(o.nome).includes(p)))||null}
function sitDeTexto(t){const n=semAc(t||'');if(/folga/.test(n))return 'Folga';if(/viag|desloc/.test(n))return 'Viagem';if(/atest|medic/.test(n))return 'Atestado';if(/falt/.test(n))return 'Falta';if(/chuva|parad/.test(n))return 'Parado (chuva/obra parada)';if(/sem obra|disposi/.test(n))return 'Sem obra';return 'Trabalhou'}
function aplicarLancamentos(iso,itens){const upd={},erros=[];const jd=jornadaDia(iso);
  itens.forEach(it=>{const c=acharColab(it.nome);if(!c){erros.push(it.nome+' (não achei o colaborador)');return}const sit=it.sit||sitDeTexto(it.texto||'');
    const o=it.obra?acharObra(it.obra):(c.obraAtual?S.obras.find(x=>x.id===c.obraAtual):null);if(!o&&sit!=='Sem obra'&&sit!=='Folga'){erros.push(it.nome+' (não achei a obra "'+(it.obra||'')+'")');return}
    const hn=it.horas!=null&&it.horas!==''?num(it.horas):(sit==='Trabalhou'?(diaSemana(iso)===0?0:jd):0);
    upd[c.id]={obra:o?o.id:'',sit,hn:diaSemana(iso)===0&&sit==='Trabalhou'?0:hn,h50:num(it.h50)||0,h100:diaSemana(iso)===0&&sit==='Trabalhou'?(num(it.horas)||jd||8):(num(it.h100)||0),obs:it.obs||''}});
  return{upd,erros}}
function parseTextoDiario(txt){return txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[-–;|\t]\s*|\s{2,}/).filter(Boolean);
  const horas=(l.match(/(\d+(?:[.,]\d+)?)\s*h\b/i)||[])[1];return{nome:p[0]||'',obra:p[1]||'',texto:l,horas:horas?horas.replace(',','.'):null}})}
/* viagens: obra mudou de um dia trabalhado para o seguinte */
async function gerarViagens(iso){const d=diarioDe(iso);if(!d)return 0;let n=0;const ant=S.diario.filter(x=>x.id<iso).sort((a,b)=>b.id.localeCompare(a.id)).slice(0,15);
  for(const [id,l] of Object.entries(d.linhas||{})){if(!l.obra||!['Trabalhou','Viagem'].includes(l.sit))continue;
    let prev=null;for(const x of ant){const p=(x.linhas||{})[id];if(p&&p.obra&&['Trabalhou','Viagem'].includes(p.sit)){prev=p;prev.dia=x.id;break}}
    if(prev&&prev.obra!==l.obra){const vid=id+'_'+iso;if(S.viagens.some(v=>v.id===vid))continue;const c=S.colab.find(x=>x.id===id);
      await save(()=>db.doc('viagens/'+vid).set(clean({colab:id,nome:c?c.nome:'',data:iso,de:prev.obra,para:l.obra,deDia:prev.dia,horas:null,status:'Pendente',criado:new Date().toISOString()})));n++}}return n}

/* 220 h: cada dia do mês vale 220 ÷ dias do mês por pessoa e vai para a obra daquele dia (domingo e dia sem diário seguem a última obra) */
const diasNoMes=iso=>{const [y,m]=iso.split('-').map(Number);return new Date(y,m,0).getDate()};
const horasDia=iso=>220/diasNoMes(iso);
const salMes=c=>{const s=S.sal[c.id];const m=s?(num(s.clt)||0)+(num(s.pj)||0):0;return m||null};
function ultimaObra(c,iso){for(let i=1;i<=10;i++){const x=addDias(iso,-i);const d=diarioDe(x);const l=d&&d.linhas&&d.linhas[c.id];if(l&&l.sit)return l.sit==='Sem obra'?'SEM_OBRA':(l.obra||'SEM_OBRA')}return c.obraAtual&&S.obras.some(o=>o.id===c.obraAtual)?c.obraAtual:'SEM_OBRA'}
function obraDoDia(c,iso){const d=diarioDe(iso);const l=d&&d.linhas&&d.linhas[c.id];if(l&&l.sit)return{ob:l.sit==='Sem obra'?'SEM_OBRA':(l.obra||'SEM_OBRA'),l,lancado:true};return{ob:ultimaObra(c,iso),l:null,lancado:false}}
function calcPeriodo(ini,fim){const hoje=hojeISO();if(fim>hoje)fim=hoje;const R=new Map();const semDiario=[];const at=ativosDiario();
  const add=(c,ob,k,v)=>{const key=c.id+'|'+ob;let r=R.get(key);if(!r){r={c,ob,dias:0,h:0,trab:0,he50:0,he100:0,via:0};R.set(key,r)}r[k]+=v};
  for(let d=ini;d<=fim;d=addDias(d,1)){const hd=horasDia(d);const dd=diarioDe(d);if(diaUtilDiario(d)&&!dd)semDiario.push(d);
    at.forEach(c=>{const {ob,l}=obraDoDia(c,d);add(c,ob,'dias',1);add(c,ob,'h',hd);if(l){if(num(l.hn))add(c,ob,'trab',num(l.hn));if(num(l.h50))add(c,ob,'he50',num(l.h50));if(num(l.h100))add(c,ob,'he100',num(l.h100))}});
    S.viagens.filter(v=>v.data===d&&num(v.horas)).forEach(v=>{const c=S.colab.find(x=>x.id===v.colab);if(c)add(c,v.para||'SEM_OBRA','via',num(v.horas))})}
  const linhas=[...R.values()].map(r=>{const sm=salMes(r.c);const vh=sm?sm/220:null;return{...r,vh,valor:vh!=null?vh*(r.h+r.he50*1.5+r.he100*2+r.via):null,valorExtra:vh!=null?vh*(r.he50*1.5+r.he100*2+r.via):null}});
  return{linhas,semDiario,ini,fim}}
function periodoDe(iso,p){if(p==='dia')return[iso,iso];if(p==='semana'){const w=diaSemana(iso);const ini=addDias(iso,-((w+6)%7));return[ini,addDias(ini,6)]}return[iso.slice(0,8)+'01',iso.slice(0,8)+String(diasNoMes(iso)).padStart(2,'0')]}
const nomeObD=id=>id==='SEM_OBRA'?'Sem obra (Galpão/estrutura)':(()=>{const o=S.obras.find(x=>x.id===id);return o?(o.os?o.os+' – ':'')+o.nome:id})();
const hhmm=h=>{const t=Math.round((h||0)*60);return Math.floor(t/60)+'h'+String(t%60).padStart(2,'0')};
const h2=v=>(Math.round((v||0)*100)/100).toLocaleString('pt-BR');

    <tr><th>Total</th><th></th><th class="r num">${h2(tot.h)}</th><th class="r num">${h2(tot.he50)}</th><th class="r num">${h2(tot.he100)}</th><th class="r num">${h2(tot.via)}</th>${G?`<th class="r num">${brl(tot.ve)}</th><th class="r num">${brl(tot.v)}</th>`:''}</tr></table></div>
   ${p!=='dia'?`<details><summary class="small">Ver por colaborador</summary><div class="tw"><table><tr><th>Colaborador</th><th>Função</th><th>Obra</th><th class="r">Dias</th><th class="r">Horas trabalhadas</th><th class="r">Horas (220)</th><th class="r">HE 50%</th><th class="r">HE 100%</th><th class="r">Hora viagem</th>${G?'<th class="r">Total R$</th>':''}</tr>
    ${P_.linhas.sort((a,b)=>(a.c.nome||'').localeCompare(b.c.nome||'')||b.h-a.h).map(l=>`<tr><td>${esc(l.c.nome)}</td><td class="small">${esc(l.c.funcao||'')}</td><td class="small">${esc(nomeObD(l.ob))}</td><td class="r num">${l.dias}</td><td class="r num">${h2(l.trab)}</td><td class="r num"><b>${h2(l.h)}</b></td><td class="r num">${h2(l.he50)}</td><td class="r num">${h2(l.he100)}</td><td class="r num">${h2(l.via)}</td>${G?`<td class="r num">${brl(l.valor,2)}</td>`:''}</tr>`).join('')}</table></div></details>`:''}</div>`}

function relFech(){const V=S.view.di||{data:hojeISO(),per:'mes'};const p=V.per||'dia';const [ini,fim]=periodoDe(V.data,p);const F=calcPeriodo(ini,fim);const G=S.me.isG;const ob=id=>id==='SEM_OBRA'?{os:'',nome:'Sem obra (Galpão/estrutura)'}:(S.obras.find(x=>x.id===id)||{os:'',nome:id});

/* ---------- Economias: ideias → validadas → executadas (só executadas contam) ---------- */
const NATUREZAS=['Hospedagem','Mão de obra','Folga / passagem','Passagem / viagem','Alimentação','Transporte / frete','Material','Ferramentas / equipamentos','Locação','Outros'];
const ECO_ST=['Ideia','Validada','Executada','Descartada'];
const podeValidarEco=()=>S.me.canWrite!==false&&(S.me.isG||!!(S.me.id&&S.membros[S.me.id]&&S.membros[S.me.id].papel==='Coordenador'));
const mesesEntre=(a,b)=>{if(!a)return 0;const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.max(0,(y2-y1)*12+(m2-m1)+((d2>=d1)?0:-1)+1)};
function ecoCalc(e){const v=num(e.valor)||0;const hoje=hojeISO();
  if(e.recorr==='mes'){const m=num(e.meses)||12;const dec=e.status==='Executada'&&e.inicio?Math.min(m,mesesEntre(e.inicio,hoje)):0;return{total:v*m,ano:v*Math.min(12,m),mes:v,ateHoje:v*dec,txt:brl(v)+'/mês × '+m+' meses'}}
  if(e.recorr==='ano'){const a=num(e.meses)||1;return{total:v*a,ano:v,mes:v/12,ateHoje:e.status==='Executada'&&e.inicio&&e.inicio<=hoje?v*Math.min(a,Math.ceil(mesesEntre(e.inicio,hoje)/12)):0,txt:brl(v)+'/ano × '+a+' ano(s)'}}
  return{total:v,ano:v,mes:0,ateHoje:e.status==='Executada'&&(!e.inicio||e.inicio<=hoje)?v:0,txt:'única vez'}}
const ecoCC=e=>e.geral?'Todas as obras (geral)':(()=>{const o=S.obras.find(x=>x.id===e.obra);return e.centro||(o?(o.os?o.os+' – ':'')+o.nome:(e.obraNome||'—'))})();
function vEconomias(){const V=S.view.ec||(S.view.ec={st:'Executada',nat:'',cc:'',sol:''});const w=S.me.canWrite!==false;const val=podeValidarEco();
  const todas=S.eco;const exe=todas.filter(e=>e.status==='Executada');const K=exe.reduce((t,e)=>{const c=ecoCalc(e);t.total+=c.total;t.ano+=c.ano;t.mes+=c.mes;t.ate+=c.ateHoje;return t},{total:0,ano:0,mes:0,ate:0});
  const filt=todas.filter(e=>(!V.st||e.status===V.st)&&(!V.nat||e.natureza===V.nat)&&(!V.cc||ecoCC(e)===V.cc)&&(!V.sol||e.solicitante===V.sol)).sort((a,b)=>(b.criado||'').localeCompare(a.criado||''));
  const cnt=s=>todas.filter(e=>e.status===s).length;const ccs=[...new Set(todas.map(ecoCC))].sort();const sols=[...new Set(todas.map(e=>e.solicitante).filter(Boolean))].sort();

function cnpjValido(c){const n=String(c||'').replace(/\D/g,'');if(n.length!==14||/^(\d)\1+$/.test(n))return false;const calc=l=>{let s=0,p=l-7;for(let i=0;i<l;i++){s+=+n[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+n[12]&&calc(13)===+n[13]}

function folgasProj(c,e,ate){const fd=+P().folgaDias||5;const hoje=hojeISO();const out=[];if(e.local||!(e.iv>0))return out;let ini;
  if(e.volta!=null){out.push([hoje,e.retEf]);ini=e.retEf}
  else if(e.comeca!=null)ini=e.ini;
  else{let sd=e.prox;if(!sd)return out;if(sd<=hoje)sd=addDias(hoje,1);const r=(e.retEf&&e.saidaEf===e.prox)?e.retEf:addDias(sd,fd);out.push([sd,r]);ini=r}
  let g=0;while(ini&&ini<ate&&g++<40){const sd=addDias(ini,e.iv),r=addDias(sd,fd);out.push([sd,r]);ini=r}return out}
const ficaAte=c=>{if(c.ficaAte)return c.ficaAte;const o=S.obras.find(x=>x.id===c.obraAtual);return o&&o.dataFim||''};
function statusEm(c,d,proj){if(!c.obraAtual||!S.obras.some(o=>o.id===c.obraAtual))return 'livre';const f=ficaAte(c);if(f&&d>f)return 'livre';if(proj.some(([a,b])=>d>=a&&d<b))return 'folga';return 'obra'}
function vDisponiveis(){
  const V=S.view.d;const w=S.me.canWrite!==false;const coord=V.esCoord||'';const hoje=hojeISO();

  const ativos=S.colab.filter(c=>c.status!=='Desligado'&&(coord?ids.has(c.obraAtual):true));
  const sem=16;const ate=addDias(hoje,sem*7+7);
  const P_=ativos.map(c=>{const e=linhaEscala(c);return{c,e,proj:folgasProj(c,e,ate)}});
  const datas=[...Array(sem+1)].map((_,i)=>addDias(hoje,i*7));
  const serie=datas.map(d=>{const g={obra:[],folga:[],livre:[]};P_.forEach(x=>g[statusEm(x.c,d,x.proj)].push(x.c));return{d,g,eq:{obra:contaEquipe(g.obra).eq,folga:contaEquipe(g.folga).eq,livre:contaEquipe(g.livre).eq}}});
  const max=Math.max(1,...serie.map(x=>x.eq.obra+x.eq.folga+x.eq.livre));
  const W=760,H=260,pl=34,pb=34,pt=10,bw=(W-pl-10)/serie.length;const y=v=>pt+(H-pt-pb)*(1-v/max);
  const COR={obra:'var(--idle)',folga:'var(--accent)',livre:'var(--good)'};const LBL={obra:'Trabalhando em obra',folga:'De folga',livre:'Livres (sem obra)'};
  const ticks=[...new Set([0,Math.round(max/2),max])];
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Equipes por semana" style="width:100%;max-width:${W}px;height:auto">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    ${serie.map((x,i)=>{let acc=0;const bx=pl+i*bw+bw*0.15;return ['obra','folga','livre'].map(k=>{const v=x.eq[k];if(!v)return '';const y1=y(acc+v),y0=y(acc);acc+=v;return `<rect x="${bx}" y="${y1}" width="${bw*0.7}" height="${Math.max(0,y0-y1)}" fill="${COR[k]}" data-act="disp-dia" data-v="${x.d}" style="cursor:pointer"><title>${dbr(x.d)} · ${LBL[k]}: ${v} equipe(s) · ${x.g[k].length} pessoa(s)</title></rect>`}).join('')+`<text x="${bx+bw*0.35}" y="${H-pb+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.d.slice(8,10)}/${x.d.slice(5,7)}</text>${x.eq.livre?`<text x="${bx+bw*0.35}" y="${y(x.eq.obra+x.eq.folga+x.eq.livre)-4}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--good)">${x.eq.livre}</text>`:''}`}).join('')}
  </svg>`;

  const gSel={obra:[],folga:[],livre:[]};P_.forEach(x=>gSel[statusEm(x.c,dSel,x.proj)].push(x));

function custoPessoa(c,s){const p=P();const clt=num(s&&s.clt)??(s&&s.regime!=='PJ'?num(s.salario):null)??0,pj=num(s&&s.pj)??(s&&s.regime==='PJ'?num(s.salario):null)??0;
  const pf=num(s&&s.porFora)??0;/* "Por fora": só o valor mensal, sem 13º, férias ou encargos */
  const enc=encCLT(p);const sal=clt+pj+pf,prov=clt*(1+1/3)/12,encM=(clt*12+clt*(1+1/3))*enc/12,pjx=pj*p.pjenc;
  const iv=folgaDe(c);const fa=iv==null?folgasAno(folgaPadrao(c.funcao)):folgasAno(iv);const pc=num(c.passagemCiclo);const via=pc==null?null:fa*pc/12;
  const mo=sal+prov+encM+pjx;return{clt,pj,pf,sal,prov,encM:encM+pjx,mo,fa,pc,via,tot:mo+(via||0),semSal:!clt&&!pj&&!pf}}

   ${(nc.regime||'CLT')!=='CLT'?`<label class="f"><span>Mensal PJ / NF (R$)</span><input id="nc-pj" data-nc="pj" type="number" step="0.01" min="0" value="${esc(nc.pj||'')}"></label>`:''}

  <div class="small muted">Mesma conta da planilha de custos: 12 salários + 13º + 1/3 de férias, com encargos de ${n1(encCLT(P())*100)}% sobre a parte CLT (CPP, RAT×FAP, terceiros e FGTS). PJ sem encargos. Viagens = folgas no ano × passagem + traslado por folga, ÷ 12. Sem benefícios, alojamento, alimentação, rescisões ou horas extras. Os períodos são o custo mensal multiplicado pelos meses.</div>`
  :'<div class="card muted">Nenhum colaborador encontrado.</div>'}`;

/* ---------- eventos ---------- */
function bindMain(){
  const m=$('#main');
  m.oninput=e=>{const t=e.target;if(S.route==='gases'){gasesEvent(e);return}
    if(t.id==='c-q'){S.view.c.q=t.value;render();return}
    if(t.id==='b-q'){S.view.b.q=t.value;S.view.b.lim=150;render();return}
    if(t.id==='fat-q'){S.view.f.q=t.value;clearTimeout(m._t);m._t=setTimeout(render,300);return}
    if(t.id==='mc-duplas'){S.view.d.comp.duplas=Math.max(0,Math.min(20,parseInt(t.value)||0));clearTimeout(m._t);m._t=setTimeout(render,400);return}
    if(t.dataset.q){S.view.d.comp.q[t.dataset.q]=Math.max(0,Math.min(20,parseInt(t.value)||0));clearTimeout(m._t);m._t=setTimeout(render,400);return}
    if(t.dataset.p!=null){S.view.d.pessoas[+t.dataset.p][t.dataset.pk]=t.type==='checkbox'?t.checked:t.value;if(t.type==='checkbox'){render();return}clearTimeout(m._t);m._t=setTimeout(render,400);return}
    if(t.id&&t.id.startsWith('d-')&&t.tagName==='INPUT'){S.view.d[t.id.slice(2)]=t.value;if(t.type==='date')return;clearTimeout(m._t);m._t=setTimeout(render,400);return}
    if(t.dataset.ed){S.view.b.edit.data[t.dataset.ed]=t.value;return}
    if(t.id==='cfg-busca'){clearTimeout(m._s);m._s=setTimeout(()=>buscar(t.value),300)}
  };
  m.onchange=async e=>{const t=e.target;if(S.route==='gases'){await gasesEvent(e);return}
    if(t.id==='mc-prio'){S.view.d.comp.prio=t.value;render();return}
    if(t.dataset.esini){await save(()=>db.doc('colaboradores/'+t.dataset.esini).update({cicloInicio:t.value}));return}
    if(t.dataset.essai){await save(()=>db.doc('colaboradores/'+t.dataset.essai).update({saidaFolga:t.value,emFolga:false}));return}
    if(t.dataset.esfica){await save(()=>db.doc('colaboradores/'+t.dataset.esfica).update({ficaAte:t.value}));return}
    if(t.dataset.dl){const iso=S.view.di.data;const c=S.colab.find(x=>x.id===t.dataset.dl);const cur=linhaDiario(diarioDe(iso),c,iso);const k=t.dataset.k;let v=t.value;if(['hn','h50','h100'].includes(k))v=v===''?'':num(v);
      const up={obra:cur.obra||'',sit:cur.sit||'',hn:cur.hn??'',h50:cur.h50||0,h100:cur.h100||0,obs:cur.obs||'',[k]:v};
      if(k==='sit'){const dom=diaSemana(iso)===0;if(v==='Trabalhou'){if(dom){up.hn=0;if(!num(up.h100))up.h100=8}else if(up.hn===''||up.hn==null||up.hn===0)up.hn=jornadaDia(iso)}else{up.hn=0}if(v==='Sem obra')up.obra=''}
      await salvarLinhas(iso,{[c.id]:up});return}
    if(t.id==='dd-data'){S.view.di.data=t.value||hojeISO();S.view.di.msg='';render();return}
    if(t.id==='dd-ord'){S.view.di.ord=t.value;try{localStorage.setItem('diarioOrd',t.value)}catch(e){}render();return}
    if(t.id==='dd-texto'){S.view.di.texto=t.value;return}
    if(t.dataset.dedit){const c=DCFG();const ed=new Set(c.editores||[]);t.checked?ed.add(t.dataset.dedit):ed.delete(t.dataset.dedit);await save(()=>db.doc('config/diario').set({...c,editores:[...ed]}),t.checked?'Liberado para lançar o diário.':'Acesso ao diário retirado.');return}
    if(t.dataset.dcfg){const c=DCFG();c[t.dataset.dcfg]=t.type==='number'?num(t.value):t.value;await save(()=>db.doc('config/diario').set(c),'Salvo.');return}
    if(t.id==='fe-mes'){S.view.fe.mes=t.value||hojeISO().slice(0,7);render();return}
    if(t.dataset.vh){const v=S.viagens.find(x=>x.id===t.dataset.vh);await save(()=>db.doc('viagens/'+v.id).update({horas:t.value===''?null:num(t.value),status:t.value===''?'Pendente':'Preenchido',preenchidoPor:S.me.name||'',preenchidoEm:new Date().toISOString()}),'Hora viagem salva.');return}
    if(t.dataset.vo){await save(()=>db.doc('viagens/'+t.dataset.vo).update({obs:t.value}));return}

S.prog='';
function setProg(t){S.prog=t;document.querySelectorAll('.prog').forEach(e=>e.innerHTML=t?'<div class="notice">'+esc(t)+'</div>':'')}

let BUSY=false;
async function writeMany(docs,label,col='passagens'){
  const ids=Object.keys(docs);let ok=0;BUSY=true;
  for(let i=0;i<ids.length;i++){let tries=0;
    while(true){try{await db.doc(col+'/'+ids[i]).set(docs[ids[i]]);ok++;break}
      catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&tries<6){tries++;await new Promise(r=>setTimeout(r,1500*tries));continue}
        if(e&&e.code==='invalid_argument')S.me.canWrite=false;BUSY=false;
        setProg('Parou em '+ok+' de '+ids.length+'. '+(e&&e.code==='invalid_argument'?'Seu acesso não permite gravar.':'Tente de novo; o que já foi gravado não duplica.'));return ok}}
    if(i%10===0)setProg(label+': '+ok+' de '+ids.length+'… deixe a página aberta.');
    await new Promise(r=>setTimeout(r,120))}
  BUSY=false;return ok}

function busCity(s){s=String(s||'').trim();const i=s.lastIndexOf(',');if(i<0)return s;const uf=s.slice(i+1).trim();let n=s.slice(0,i);
  if(n.includes('Aeroporto Guarulhos'))return 'São Paulo/SP';if(n.startsWith('Campo Grande - Igreja')&&uf==='RJ')return 'Rio de Janeiro/RJ';
  n=n.split(' - ')[0].trim().replace("D'Oeste",'d’Oeste').replace(' De ',' de ');return n+'/'+uf}
function brNum(s){if(typeof s==='number')return s;const x=parseFloat(String(s||'').replace('R$','').replace(/\./g,'').replace(',','.').trim());return isFinite(x)?x:0}
function isoD(v){if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}
  const m=String(v||'').match(/(\d\d)\/(\d\d)\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''}
async function importar(file){
  const out={set innerHTML(v){setProg(v.replace(/<[^>]+>/g,''))}};if(typeof XLSX==='undefined'){out.innerHTML='<div class="notice">O leitor de Excel não carregou. Recarregue a página.</div>';return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const docs={};const semIata=new Set();
    const ext=wb.Sheets['Extrato de Vendas'];
    if(ext){const num_=(file.name.match(/Fatura_(\d+)/)||[])[1]||'';
      for(const x of XLSX.utils.sheet_to_json(ext,{defval:null})){const id=String(x['Cód. QP']||'');if(!/^\d+$/.test(id))continue;
        const o=busCity(x['Origem']),de=busCity(x['Destino']);const n=parseInt(x['Nº Passagens'])||1;const v=brNum(x['Valor Compra']);
        const ok=String(x['Pagamento']).startsWith('Pagamento Efetuado')&&v>0&&!x['Data Cancelamento']&&o!==de;
        docs['b-'+id]={data:isoD(x['Data Partida']),fatura:'Fatura '+num_,modal:'Ônibus',passageiro:[...new Set(String(x['Passageiro']||'').split(','))].join(' + '),origem:o,destino:de,rota:String(x['Trecho']||''),trechos:n,valor:Math.round(v*100)/100,status:ok?'Válida':'Cancelada/estorno',cia:String(x['Viação']||'').trim(),obra:''}}}
    else{const ws=wb.Sheets[wb.SheetNames[0]];
      for(const x of XLSX.utils.sheet_to_json(ws,{defval:null})){if(!x['Venda Nº']||!x['Rota Resumida'])continue;
        const c=String(x['Rota Resumida']).split('/').filter(Boolean);if(c.length<2)continue;if(c.some(k=>!IATA[k])){c.filter(k=>!IATA[k]).forEach(k=>semIata.add(k));continue}
        const rt=c[0]===c[c.length-1];const o=IATA[c[0]],de=IATA[rt?c[1]:c[c.length-1]];let pax=String(x['Pax']||'');if(pax.includes('/')){const[a,b]=pax.split('/');pax=b+' '+a}
        const v=+x['Total']||0;
        docs['a-'+x['Venda Nº']]={data:isoD(x['Dt. Início Serviços']||x['Data Venda']),fatura:'FT '+(x['Nrs. FT (Cli)']||''),modal:'Avião',passageiro:pax.toLowerCase().replace(/\b\p{L}/gu,m=>m.toUpperCase()),origem:o,destino:de,rota:c.join('/'),trechos:rt?2:1,valor:Math.round(v*100)/100,status:v>=100?'Válida':'Desconsiderar',cia:x['Nome Fantasia Cia']||'',obra:x['Desc. C. Custo Cliente']||''}}}
    const ids=Object.keys(docs);if(!ids.length){out.innerHTML='<div class="notice">Não reconheci passagens nesse arquivo. Use o Excel da agência aérea (FT) ou o extrato da Quero Passagem.</div>';return}
    const novos=ids.filter(i=>!S.pass.some(p=>p.id===i)).length;
    out.innerHTML=`<div class="notice">Gravando ${ids.length} passagens (${novos} novas)…</div>`;
    const okc=await writeMany(docs,'Gravando fatura');
    out.innerHTML=`<div class="notice">${okc} de ${ids.length} passagens gravadas (${novos} novas).${semIata.size?' Aeroportos sem cidade cadastrada, linhas ignoradas: '+esc([...semIata].join(', '))+'.':''}</div>`;
  }catch(e){out.innerHTML='<div class="notice">Não consegui ler esse arquivo. Confira se é o .xlsx original da fatura.</div>'}
}

  listen('contatos','cont',a=>{const antes=S.cont.filter(c=>c.status==='Pendente').length;S.cont=a;const agora=a.filter(c=>c.status==='Pendente').length;if(S.loaded._contOk&&agora>antes&&souAuxiliar()){NOTIF_FECHADO=0;bip()}S.loaded._contOk=true;renderNotif()});
  listen('gases_lancamentos','gasl',a=>S.gasl=a);listen('gases_pendencias','gasp',a=>S.gasp=a);listen('gases_boletos','gasb',a=>S.gasb=a);
  listen('fat_pedidos','fatp',a=>S.fatp=a);listen('fat_nfs','fatn',a=>S.fatn=a);listen('fat_cobrancas','fatc',a=>S.fatc=a);
  listen('membros','membros',a=>{S.membros={};a.forEach(m=>S.membros[m.id]={papel:m.papel,coord:m.coord||''});if(!S.me.isG&&S.me.id&&S.membros[S.me.id])S.me.papel=S.membros[S.me.id].papel;else if(S.me.isG)S.me.papel='Gerente';whoR()});
  if(S.me.isG)listen('salarios','sal',a=>{S.sal={};a.forEach(s=>S.sal[s.id]=s)});
  db.doc('config/params').onSnapshot(d=>{S.params=d.exists?d.data():null;refreshLists();if(S.route!=='config')render()},()=>{});
  go();
}
refreshLists();go();boot();
</script>
