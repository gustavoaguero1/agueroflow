name: Validar AgueroFlow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, testes e emuladores
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configurar Java para Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Atualizar bun.lock conforme package.json
        run: bun install --lockfile-only

      - name: Publicar lockfile gerado para revisão
        uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lockfile
          path: bun.lock
          if-no-files-found: error

      - name: Instalar dependências pelo lockfile
        run: bun install --frozen-lockfile

      - name: Verificar TypeScript
        run: npm run lint

      - name: Executar testes unitários
        run: npm test

      - name: Compilar aplicação
        run: npm run build

      - name: Executar testes com Firebase Emulators
        run: npm run test:emulator
